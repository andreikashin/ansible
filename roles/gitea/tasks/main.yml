---
# --- 1. PRE-FLIGHT CHECKS (Local) ---
- name: "Pre-flight: Check if Gitea SSL Key exists locally"
  stat:
    path: "{{ role_path }}/files/ssl/gitea.key"
  delegate_to: localhost
  become: no
  register: ssl_key_check

- name: "Fail if SSL Key is missing"
  fail:
    msg: "ERROR: Private key missing! Put gitea.key and gitea.crt in {{ role_path }}/files/ssl/"
  when: not ssl_key_check.stat.exists

# --- 2. INSTALL DOCKER COMPOSE (MANUAL) ---
- name: Create directory for Docker CLI plugins
  file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    mode: '0755'

- name: Install Docker Compose (Manual Binary Download)
  get_url:
    url: https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-linux-x86_64
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    mode: '0755' # Make executable immediately (+x)

# --- 3. SERVER PREPARATION ---
- name: Create installation directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ gitea_install_dir }}"

- name: Create secure SSL directory
  file:
    path: "{{ gitea_ssl_dir }}"
    state: directory
    mode: '0700'
    owner: '1000'
    group: '1000'

# --- 4. SET UP TRUST (HOST LEVEL) ---
# Install Jenkins certificate directly on the LXC host, not inside Docker
- name: Upload Jenkins CA to Host System
  copy:
    src: "trust/root_ca.crt"
    dest: "{{ gitea_ssl_dir }}/root_ca.crt"
    mode: '0644'
    owner: '1000'
    group: '1000'
  notify: Restart Gitea

- name: Create custom CA bundle for Gitea
  shell: "cat /etc/ssl/certs/ca-certificates.crt {{ gitea_ssl_dir }}/root_ca.crt > {{ gitea_ssl_dir }}/gitea_bundle.crt"
  notify: Restart Gitea

- name: Fix permissions on custom bundle
  file:
    path: "{{ gitea_ssl_dir }}/gitea_bundle.crt"
    mode: '0644'
    owner: '1000'
    group: '1000'
  notify: Restart Gitea

# --- 5. UPLOAD SSL FOR GITEA ---
- name: Upload Gitea Server Certificate (Public)
  copy:
    src: "ssl/gitea.crt"
    dest: "{{ gitea_ssl_dir }}/gitea.crt"
    mode: '0644'
    owner: '1000'
    group: '1000'
  notify: Restart Gitea

- name: Upload Gitea Server Key (Private)
  copy:
    src: "ssl/gitea.key"
    dest: "{{ gitea_ssl_dir }}/gitea.key"
    mode: '0600'
    owner: '1000'
    group: '1000'
  notify: Restart Gitea

# --- 6. DOCKER CONFIGURATION ---
- name: Generate docker-compose.yml
  template:
    src: "docker-compose.yml.j2"
    dest: "{{ gitea_install_dir }}/docker-compose.yml"
  notify: Restart Gitea

# --- 7. START ---
- name: Ensure persistent data volume exists
  command: docker volume create gitea_data
  register: volume_create
  changed_when: "volume_create.rc == 0 and 'gitea_data' not in volume_create.stdout"
  failed_when: false

- name: Start Gitea Stack
  community.docker.docker_compose_v2:
    project_src: "{{ gitea_install_dir }}"
    state: present